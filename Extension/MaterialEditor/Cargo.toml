[package]
name = "MaterialEditor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.36.1"
egui-phosphor = "0.13.0"
egui-snarl = { version = "0.12.0", features = ["serde"] }
glam = "0.33.6"
image = "0.25.10"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
