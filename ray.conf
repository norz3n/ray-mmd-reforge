// Sun light
// 0 : None
// 1 : Enable
// 2 : Sun radiance calculated from solar zenith angle
#define SUN_LIGHT_ENABLE 2

// 0 : None
// 1 : Low    ( 512 * 4)
// 2 : Medium (1024 * 4)
// 3 : High   (2048 * 4)
// 4 : boom!  (4096 * 4)
// 5 : boom!! (8192 * 4)
#define SUN_SHADOW_QUALITY 2

// Contact Shadows (Screen-Space Contact Shadows)
// 0 : Disabled
// 1 : Enabled ( 8 steps)
// 2 : Enabled (12 steps)
// 3 : Enabled (16 steps)
#define CONTACT_SHADOW_QUALITY 3

// Screen-Space Global Shadows (SSGS)
// Long-range screen-space ray tracing toward the directional (sun) light.
// Casts soft penumbra shadows between nearby objects without a shadow map.
// Works independently of CONTACT_SHADOW_QUALITY.
// 0 : Disabled
// 1 : Enabled (16 steps, ~3m range)
// 2 : Enabled (24 steps, ~8m range)
// 3 : Enabled (32 steps, ~15m range)
#define SSGS_QUALITY 3

// Image Based Lighting
// 1 : Enable
// 2 : Enable + UV filp
#define IBL_QUALITY 1

// Fog Tab
// 0 : None
// 1 : Enable
#define FOG_ENABLE 1

// Light Tab
// 0 : None
// 1 : Enable
#define MULTI_LIGHT_ENABLE 1

// Outline Tab
// 0 : None
// 1 : Enable
// 2 : Enable + SMAA
// 3 : Enable + SSAA
#define OUTLINE_QUALITY 0

// Toon-shading material
// 0 : None
// 1 : Toon material support
// 2 : Toon material support with diffusion
#define TOON_ENABLE 0

// Toon look grading - applies to CEL / TONEBASED materials only.
// Ported from HAToon2/PAToon2, M4Toon2, Jashin Toon and T_ToonShader.
// Shadow color grade, applied on top of the material's own shadow color (customB):
#define TOON_SHADOW_MUL         float3(1.0, 1.0, 1.0) // multiply the shadow color
#define TOON_SHADOW_ADD         float3(0.0, 0.0, 0.0) // then add
#define TOON_SHADOW_HUE         0    // rotate shadow hue, degrees (-180 .. 180)
#define TOON_SHADOW_WARMTH      0    // 0..1 luminance-preserving warm push (anime skin shadows)
// Auto-tint shadows over low-saturation albedo (white clothes, skin) so they
// don't read as gray dirt. Tint strength scales with (1 - saturation).
#define TOON_AUTOTINT_COLOR     float3(0.95, 0.80, 1.05) // 0 = off; soft pink-lavender anime tint
#define TOON_AUTOTINT_THRESHOLD 0.03                  // max base saturation still treated as colorless
#define TOON_AUTOTINT_STRENGTH  1.0                   // 0..1
// Fallback when a material defines no shadow color (customB = 0): derive it
// from the albedo as pow(albedo, TOON_SELF_POWER_SHADOW). 0 = old behavior.
#define TOON_SELF_POWER_SHADOW  0    // try ~0.98 (Jashin Toon SelfPowerShadowStrength)
// Rim light folded into the terminator before banding, so it inherits the cel bands
#define TOON_RIM_STRENGTH       0 // 0 = off; ~0.15-0.4 to taste
#define TOON_RIM_POWER          2.5  // silhouette falloff sharpness

// Method for Ambient Occlusion
// 0 : SSAO / SSDO (Original Ray-MMD)
// 1 : HBSSDO (Horizon-Based Screen-Space Directional Occlusion, Reforge Edition)
#define SSAO_TYPE 1

// Screen Space Directional Occlusion
// 0 : None
// 1 :  8 samples
// 2 : 12 samples
// 3 : 16 samples
// 4 : 20 samples // https://www.slideshare.net/ozlael/mssao-presentation
// 5 : 24 samples
// 6 : 28 samples
#define SSDO_QUALITY 3

// Screen Space Reflection (Hi-Z Screen-Space Reflections)
// Experimental: suitable for local, rough reflections only. Screen-space data
// cannot reflect off-screen or hidden geometry; a mirror floor may show gaps
// and distortions. Disabled by default for stable rendering.
// 0 : Disabled
// 1 : 8 samples
// 2 : 16 samples
// 3 : 32 samples
#define SSR_QUALITY 0

// Screen-Space Refraction for glass materials (SHADINGMODELID_GLASS).
// Traces the refracted ray through the Hi-Z depth pyramid to find the true background
// point instead of a flat screen-space offset. Fully independent of GI/SSR: it builds
// its own Hi-Z pyramid when neither GI_ENABLE nor SSR_QUALITY is active.
// 0 : Disabled (flat screen-offset refraction)
// 1 : Enable
#define GLASS_REFRACTION 1

// Global Illumination (Screen-Space Raytraced GI)
// 0 : Disabled
// 1 : Accent    // Clean, focused local contact bounces & emissive glow
// 2 : Indirect  // UE5-style Multi-Bounce Global Illumination & ambient room radiance
#define GI_ENABLE 2

// GI Quality (Ray-LAB SSGI Presets)
// 1 : 4 directions * 4 samples
// 2 : 6 directions * 4 samples
// 3 : 8 directions * 4 samples
// 4 : 6 directions * 8 samples
// 5 : 8 directions * 8 samples
// 6 : 12 directions * 12 samples
// 7 : 16 directions * 16 samples
#define GI_QUALITY 3

// Specular GI: reuses the denoised GI radiance as a local indirect specular term (Fresnel-weighted).
// Fills colored indirect reflections on rough surfaces where mirror SSR misses and the IBL cubemap is too blurry.
// 0 : Disabled
// 1 : Enable
#define SSGI_SPECULAR_GI 1

// Screen Space Subsurface Scattering
// 0 : None
// 1 : Enable
#define SSSS_QUALITY 1

// Bokeh Depth Of Field
// https://docs.unrealengine.com/4.27/en-US/RenderingAndGraphics/PostProcessEffects/DepthOfField/
// MeasureMode (0.00 ~ 0.24) : Test circle 
// MeasureMode (0.25 ~ 0.49) : Test circle + Bone from ray.x
// MeasureMode (0.50 ~ 0.98) : FocalDistance Only
// MeasureMode (0.99 ~ 1.00) : FocalDistance + Bone from ray.x
// 0 : Disable
// 1 : Cinematic Bokeh  // "CryEngine 3 Graphics Gems" [Sousa13]
// 2 : Hexagonal Bokeh  // "Hexagonal Bokeh Blur Revisited" [Barré-Brisebois17]
#define BOKEH_MODE 2

// Eye Adaptation
// https://docs.unrealengine.com/latest/INT/Engine/Rendering/PostProcessEffects/AutomaticExposure/index.html
// 0 : None
// 1 : ISO 100 // Middle Gray at 12.7% // http://en.wikipedia.org/wiki/Film_speed
// 2 : ISO 100 // Middle Gray at 18.0%
#define HDR_EYE_ADAPTATION 2

// Bloom
// see this paper for 1st~5th HSV
// http://kalogirou.net/2006/05/20/how-to-do-good-bloom-for-hdr-rendering/
// 0 : None					// compatibility with older versions:
// 1 : inf					// 110 version before
// 2 : saturate 			// 110 version
// 3 : luminance & exposure // 120 version
// 4 : saturate & exposure 	// 130 ~ currently version
#define HDR_BLOOM_MODE 4

// Simple lensflare
// 0 : None
// 1 : Blue
// 2 : Orange
// 3 : Auto
#define HDR_FLARE_MODE 0

// Simple glare star
// 0 : None
// 1 : Anamorphic Lens Flares // blue
// 2 : Anamorphic Lens Flares // auto
// 3 : Glare star // orange
// 4 : Glare star // auto
#define HDR_STAR_MODE 1

// Tonemapping
// https://docs.unrealengine.com/latest/INT/Engine/Rendering/PostProcessEffects/ColorGrading/index.html
// 0 : Linear
// 1 : Reinhard     // color keeping based on luminance
// 2 : Hable	    // white point at 4 http://filmicworlds.com/blog/filmic-tonemapping-operators/
// 3 : Uncharted2   // white point at 8
// 4 : Hejl2015     // https://twitter.com/jimhejl/status/633777619998130176
// 5 : ACES-sRGB    // https://knarkowicz.wordpress.com/2016/01/06/aces-filmic-tone-mapping-curve
// 6 : NaughtyDog
// 7 : ACES-Fitted  // Stephen Hill exact RRT/ODT fit without hue shifting
// 8 : AgX          // Blender 4.0 standard filmic curve by Troy Sobotka (pure highlights without clipping)
#define HDR_TONEMAP_OPERATOR 8

// Anti-Aliasing
// 0 : None
// 1 : FXAA
// 2 : SMAAx1-medium // maybe, AMD graphics card does not support
// 3 : SMAAx1-high
// 4 : SMAAx2-medium
// 5 : SMAAx2-high
// 6 : TAA
#define AA_QUALITY 4

// Camera Motion Blur (Screen-Space Velocity Blur)
// 0 : Disabled
// 1 : Enabled (Works with any AA mode, uses TAAMatrixMap for velocity)
#define POST_MOTION_BLUR_ENABLE 1

// Postprocess Dispersion
// 0 : None
// 1 : Color Shift
// 2 : Multi-Spectral Chromatic Aberration
// 3 : Cinematic Barrel Lens Dispersion (Quadratic radial chromatic distortion)
#define POST_DISPERSION_MODE 3

// Contrast Adaptive Sharpening (AMD FidelityFX CAS)
// 0 : Disabled
// 1 : Enabled
#define POST_SHARPEN_ENABLE 1

// CAS Sharpening Intensity (0.0 = minimal, 0.5 = balanced default, 1.0 = maximum sharp)
#define POST_SHARPEN_INTENSITY 0.5

// Cinematic Film Grain (Applied after sharpening to hide banding)
// 0 : Disabled
// 1 : Enabled
#define FILM_GRAIN_ENABLE 0

// Film Grain Intensity (0.0 = minimal, 0.05 = subtle, 0.15 = cinematic)
#define FILM_GRAIN_INTENSITY 0.05
